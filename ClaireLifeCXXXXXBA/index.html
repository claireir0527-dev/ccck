<!-- 学校ボタンの表示・非表示 -->
<script>
const schoolToggle = document.getElementById("schoolToggle");
const schoolButtons = document.getElementById("schoolButtons");

schoolToggle.addEventListener("click", function() {
    schoolButtons.classList.toggle("show");
});
function showSchoolMap() {
    document.getElementById("schoolMapPopup")
        .classList.add("show");
}

function closeSchoolMap() {
    document.getElementById("schoolMapPopup")
        .classList.remove("show");
}
// 今月の論語を表示
function showMonthlyAnalects() {

    const month = new Date().getMonth() + 1;

    const monthText = String(month).padStart(2, "0");

    document.getElementById("analectsTitle").textContent =
        month + "月の論語";

    document.getElementById("analectsImage").src =
        "images/analects-" + monthText + ".jpg";

    document.getElementById("analectsPopup")
        .classList.add("show");
}

// 閉じる
function closeMonthlyAnalects() {

    document.getElementById("analectsPopup")
        .classList.remove("show");

}

</script>
