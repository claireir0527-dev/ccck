<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予定を追加</title>
<link rel="stylesheet" href="css/style.css">
<style>
.event-page { padding: 18px; }
.event-page header { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.event-page header a { font-size:24px; text-decoration:none; color:inherit; }
.event-page h2 { margin:0; }
.event-date-label { padding:13px 15px; border-radius:12px; background:#f2edff; color:#6336df; font-weight:bold; margin-bottom:20px; }
.event-field { margin:16px 0; }
.event-field label { display:block; font-weight:bold; margin-bottom:7px; }
.event-field input, .event-field textarea { box-sizing:border-box; width:100%; padding:13px; border:1px solid #d8d2e8; border-radius:11px; font:inherit; background:#fff; }
.event-save { width:100%; border:0; border-radius:13px; padding:15px; margin-top:12px; background:#6b3df5; color:#fff; font-size:16px; font-weight:bold; }
.event-back { display:block; text-align:center; margin-top:14px; color:#6b3df5; text-decoration:none; }
.event-error { color:#c62828; font-size:14px; min-height:20px; }

/* スマホで入力欄がはみ出さないようにする */
.event-page {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
}

.event-field {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
}

.event-field input,
.event-field textarea {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
}

/* 時間入力欄 */
.event-field input[type="time"] {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
}

</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<div class="app"><div class="phone event-page">
<header><a id="backLink" href="calendar.html" aria-label="戻る">←</a><h2>自分の予定を追加</h2></header>
<div class="event-date-label" id="eventDate">
    📅 日付を読み込み中...
</div>

<div class="event-field">
    <label for="eventStartDate">開始日</label>
    <input id="eventStartDate" type="date" placeholder="日付を選択"required>
</div>

<div class="event-field">
    <label for="eventEndDate">終了日</label>
    <input id="eventEndDate" type="date" placeholder="日付を選択" required>
</div>
<div class="event-field"><label for="eventTitle">予定の内容</label><input id="eventTitle" type="text" maxlength="80" placeholder="例：友達と遊ぶ" required></div>
<div class="event-field"><label for="eventTime">時間（任意）</label><input id="eventTime" type="time"></div>
<div class="event-field"><label for="eventMemo">メモ（任意）</label><textarea id="eventMemo" rows="4" maxlength="300" placeholder="場所や持ち物など"></textarea></div>
<div class="event-error" id="eventError" role="alert"></div>
<button class="event-save" id="saveEventButton" type="button">保存する</button>
<a class="event-back" id="cancelLink" href="calendar.html">キャンセル</a>
</div></div>
<script type="module" src="js/add-event.js"></script>
<script type="module" src="js/auth-guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
</body>
</html>
