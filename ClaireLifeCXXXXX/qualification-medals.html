
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>資格メダル | ClaireLife</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .medal-summary {
            text-align: center;
            margin: 25px 0;
        }

        .medal-summary h1 {
            color: #b8860b;
            font-size: 32px;
        }

        .medal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px 10px;
            margin-top: 25px;
        }

        .medal-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        

        .medal-name {
            font-size: 12px;
            margin-top: 8px;
            word-break: break-word;
        }

        .empty-message {
            text-align: center;
            color: #888;
            padding: 30px 10px;
            grid-column: 1 / -1;
        }

        .medal-circle {
    width: 80px;
    height: 80px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.medal-circle img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
    </style>
</head>

<body>

<div class="app">
    <div class="phone short-page">

        <div class="content">

            <header style="
    display: flex;
    flex-direction: row-reverse;
    justify-content: space-between;
    align-items: center;
">

    <h2>資格メダル</h2>

    <a href="qualification.html" class="qualification-back">
    ←
</a>
</header>

<!-- メダル取得数 -->
<div class="medal-summary">
    <h1 id="crownCount">0冠達成！</h1>
</div>

<!-- メダル一覧 -->
<div id="medalList" class="medal-grid"></div>

<button
    class="back"
    onclick="location.href='index.html'">
    ホームに戻る
</button>
        </div>

    </div>
</div>
<script type="module" src="js/qualification-medals.js"></script>
<script type="module" src="js/auth-guard.js"></script>

</body>
</html>
