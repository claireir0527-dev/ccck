<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知追加</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>


<body>
<div class="app">
<div class="phone short-page">

<header>

<a href="#" onclick="backNotice()">←</a>

<h2>🔔 通知追加</h2>

</header>


<input
    id="noticeText"
    placeholder="通知内容を入力"
>
<input
    id="noticeDate"
    type="text"
    placeholder="日付を選択"
>

<div class="notice-time-box">
    <span id="timePlaceholder">通知時間</span>
    <input type="time" id="noticeTime">
</div>
<button
    class="save"
    onclick="addNotice()"
>
💾 保存
</button>

<button 
id="cancelNoticeBtn"
class="back"
onclick="cancelNotice()"
style="display:none;">

❌ キャンセル

</button>


<button 
id="homeNoticeBtn"
class="back"
onclick="goHomeNotice()">

🏠 ホームに戻る

</button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/common.js"></script>
<script src="js/notice.js"></script>

</body>

</html>
