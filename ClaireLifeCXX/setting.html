<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>設定</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="phone short-page">


    <h2>⚙️ 設定</h2>


    <label for="iconImage">

        <img
            id="profileIcon"
            class="profile-icon"
            src="images/default.png"
        >

    </label>


    <input
        type="file"
        id="iconImage"
        accept="image/*"
        style="display:none;"
    >


    <h3 id="userName" onclick="editName()">
        名前
    </h3>


    <input
        id="nameInput"
        style="display:none;"
        onblur="saveName()"
    >

<!-- 通知設定 -->

<button
    id="notificationPermissionButton"
    class="back-btn"
    type="button"
>
    通知を許可する
</button>

<p id="notificationStatus">通知：未設定</p>

<button id="resetNotificationButton" class="back-btn" type="button">通知登録をリセット</button>
<p style="font-size:12px;">通知が何回も届くときに一度押してください。</p>

<br>



    <!-- 戻る -->

    <a href="index.html">

        <button class="back-btn">
            戻る
        </button>

    </a>


    <br><br>


    <!-- ログアウト -->

    <button
        class="back-btn"
        onclick="logoutClaireLife()"
    >
        ログアウト
    </button>


</div>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/common.js"></script>

<script src="js/setting.js"></script>

<script type="module" src="js/auth-guard.js"></script>
<script type="module">
    import { requestNotificationPermission, resetFcmRegistration } from "./js/firebase.js";

    const button =
        document.getElementById("notificationPermissionButton");

    const status =
        document.getElementById("notificationStatus");

    const resetButton = document.getElementById("resetNotificationButton");

    if (resetButton) {
        resetButton.addEventListener("click", async () => {
            resetButton.disabled = true;
            status.textContent = "通知登録をリセット中…";
            const ok = await resetFcmRegistration();
            status.textContent = ok
                ? "✅ リセット完了。ページを再読み込みしてから通知を許可してください"
                : "❌ リセットできませんでした";
            resetButton.disabled = false;
        });
    }

    if (button) {

        if ("Notification" in window &&
            Notification.permission === "granted") {
            status.textContent = "✅ 通知は許可されています";
        }

        button.addEventListener("click", async () => {

            status.textContent = "通知設定中…";
            button.disabled = true;

            const token =
                await requestNotificationPermission();

            if (token) {
                status.textContent =
                    "✅ 通知が許可され、Firebaseに登録されました";
            } else {
                status.textContent =
                    "❌ 通知を設定できませんでした";
            }

            button.disabled = false;
        });

    }
</script>
<script type="module" src="js/logout.js"></script>


</body>

</html>
