<!doctype html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b3df5">

<title>ClaireLife ログイン</title>

<link rel="stylesheet" href="css/style.css">

<style>
.login-box {
    padding: 28px 8px;
    text-align: center;
}

.login-box input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-sizing: border-box;
    font-size: 16px;
}

.login-box button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    background: #6b3df5;
    color: #fff;
    font-size: 16px;
    touch-action: manipulation;
}

.login-box .sub {
    background: #eee;
    color: #333;
}

.login-message {
    min-height: 24px;
    margin-top: 12px;
}
</style>

</head>

<body>

<div class="app">
<div class="phone">

<header>
<h2>ClaireLife</h2>
</header>

<main class="login-box">

<h3>ログイン</h3>

<input
    id="email"
    type="email"
    placeholder="メールアドレス"
    autocomplete="email"
>

<input
    id="password"
    type="password"
    placeholder="パスワード"
    autocomplete="current-password"
>

<button id="loginButton">
ログイン
</button>

<button id="signupButton" class="sub">
新規アカウント作成
</button>

<p id="message" class="login-message"></p>

</main>

</div>
</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
